{% extends "base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="card-title mb-3">註冊</h4>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                 value="{% if field.field.widget.input_type != 'password' %}{{ field.value|default:'' }}{% endif %}"
                 class="form-control {% if field.errors %}is-invalid{% endif %}">
          {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-success w-100">註冊</button>
    </form>
    <p class="mt-3 mb-0 text-center">已有帳號？<a href="{% url 'login' %}">登入</a></p>
  </div></div>
</div></div>
{% endblock %}
