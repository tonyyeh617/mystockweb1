{% extends "base.html" %}
{% block title %}登入{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body">
    <h4 class="card-title mb-3">登入</h4>
    <form method="post">{% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">帳號或密碼錯誤</div>{% endif %}
      <div class="mb-3"><label class="form-label">帳號</label>
        <input name="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">密碼</label>
        <input type="password" name="password" class="form-control" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">登入</button>
    </form>
    <p class="mt-3 mb-0 text-center">還沒有帳號？<a href="{% url 'signup' %}">註冊</a></p>
  </div></div>
</div></div>
{% endblock %}
