{% load static %}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}台股查詢xx{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">📈 台股查詢</a>
    <div class="navbar-nav ms-auto align-items-center">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'home' %}">搜尋</a>
        <a class="nav-link" href="{% url 'favorites' %}">我的最愛</a>
        <span class="navbar-text mx-2">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}
          <button class="btn btn-sm btn-outline-light">登出</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">登入</a>
        <a class="nav-link" href="{% url 'signup' %}">註冊</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show">
      {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
